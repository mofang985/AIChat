services:
  postgres:
    image: postgres:18
    container_name: aichat-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-aichat}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-CHANGE_ME}"
    volumes:
      - aichat-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aichat}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aichat-postgres-data:
